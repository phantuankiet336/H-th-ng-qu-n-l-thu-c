<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharma Care</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img" focusable="false">
            <rect width="48" height="48" rx="12"></rect>
            <g transform="rotate(-45 24 24)">
              <rect x="13" y="7" width="22" height="34" rx="11"></rect>
              <line x1="13" y1="24" x2="35" y2="24"></line>
            </g>
          </svg>
        </div>
        <div>
          <h1>Pharma Care</h1>
          <p id="facilityName">Kho dược nội bộ</p>
        </div>
      </div>
      <nav id="mainNav" class="nav"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="global-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.8-3.8"></path></svg>
          <input id="globalSearch" type="search" placeholder="Tìm kiếm thuốc, lô, từ khóa... (Enter)">
        </div>
        <div class="top-profile">
          <button class="icon-btn" id="backupBtn" type="button" title="Sao lưu dữ liệu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10"></path><path d="m8 9 4 4 4-4"></path><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"></path></svg>
          </button>
          <button class="icon-btn" id="restoreBtn" type="button" title="Nhập sao lưu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11"></path><path d="m16 15-4-4-4 4"></path><path d="M5 10V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"></path></svg>
          </button>
          <button class="icon-btn bell" id="printBtn" type="button" title="In màn hình">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V4h12v5"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v7H6z"></path></svg>
          </button>
          <div class="profile-divider"></div>
          <div class="profile-text">
            <strong>Nguyễn Dược Sĩ</strong>
            <span>Thủ kho</span>
            <time id="realtimeClock">--:--:--</time>
          </div>
          <div class="avatar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
          </div>
          <input id="restoreInput" type="file" accept="application/json" hidden>
        </div>
      </header>

      <section class="view-heading">
        <div>
          <h2 id="viewTitle">Tổng quan</h2>
          <p id="viewSubtitle">Theo dõi tồn kho, hạn dùng và hoạt động.</p>
        </div>
        <button class="btn primary" id="quickReportBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h4l2-7 4 14 2-7h4"></path></svg>
          Xuất báo cáo nhanh
        </button>
      </section>

      <section id="appView" aria-live="polite"></section>
    </main>
  </div>

  <div id="toastHost" class="toast-host"></div>
  <script src="app.js"></script>
</body>
</html>
